<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f0f0f; color: #eee; display: flex; flex-direction: column; height: 100vh; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 14px; }
    .user { background: #2563eb; align-self: flex-end; }
    .assistant { background: #1e1e2e; border: 1px solid #333; align-self: flex-start; }
    #input-row { display: flex; gap: 10px; padding: 16px; border-top: 1px solid #222; }
    #input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #333; background: #1a1a2e; color: #eee; font-size: 14px; }
    #send { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    #send:hover { background: #1d4ed8; }
    #send:disabled { background: #444; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="chat"></div>
  <div id="input-row">
    <input id="input" type="text" placeholder="Type a message..." />
    <button id="send" onclick="sendMessage()">Send</button>
  </div>

<script>
  let sessionId = "";

  function appendMessage(role, text) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const message = input.value.trim();
    if (!message) return;

    input.value = "";
    send.disabled = true;
    appendMessage("user", message);

    // Streaming response
    const assistantDiv = appendMessage("assistant", "▌");

    try {
      const response = await fetch("/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, session_id: sessionId })
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let fullText = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        fullText += decoder.decode(value);
        assistantDiv.textContent = fullText + "▌";
      }

      assistantDiv.textContent = fullText;
    } catch (err) {
      assistantDiv.textContent = "Error: could not reach backend.";
    }

    send.disabled = false;
    input.focus();
  }

  document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
